# MiniEssential - Fabric client utility mod for Minecraft 1.21.x (Java 21)
# Target a different 1.21.x sub-version by changing these three lines.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
fabric_version=0.138.0+1.21.11

# Fabric Loom version. Pin to a specific release from:
# https://mvnrepository.com/artifact/fabric-loom/fabric-loom.gradle.plugin
# 1.7-SNAPSHOT tracks the latest 1.7.x build.
loom_version=1.7-SNAPSHOT

org.gradle.jvmargs=-Xmx2G
org.gradle.java.installations.auto-download=true
